name: Mission test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mission-test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm godot.zip

      - name: Import project
        run: ./godot --headless --import || true

      - name: Run mission test
        run: |
          ./godot --headless --fixed-fps 60 res://tests/mission_test.tscn 2>&1 | tee mission.log
          grep -q "MISSION TEST PASSED" mission.log
          ! grep -q "SCRIPT ERROR" mission.log

      - name: Run menu test
        run: |
          ./godot --headless --fixed-fps 60 res://tests/menu_test.tscn 2>&1 | tee menu.log
          grep -q "MENU TEST PASSED" menu.log
          ! grep -q "SCRIPT ERROR" menu.log

      - name: Run POW test
        run: |
          ./godot --headless --fixed-fps 60 res://tests/pow_test.tscn 2>&1 | tee pow.log
          grep -q "POW TEST PASSED" pow.log
          ! grep -q "SCRIPT ERROR" pow.log
